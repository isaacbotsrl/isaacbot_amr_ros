# Wheel-speed loop: isaacbot_amr_drive_controller -> hardware. Each wheel's DCC1020 closes the
# speed loop on board (MotorVelocityController: trapezoidal profile + PID, rescaled to motor RPM -
# see isaacbot_amr_hardware_interface PhidgetMotorDriver), so diff_drive writes the wheel joints'
# velocity command interfaces directly. The on-board velocity gains and ramp live in the URDF
# (ardennes_macro.urdf.xacro). The host-side wheel PIDs of the DCC1000 era are gone; their tuning
# history is in docs/wheel_pid_tuning_notes.md.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 50

      # Topic remaps live here, not on ros2_control_node. controller_manager creates
      # every controller as its own node with use_global_arguments=false, so
      # command-line remaps given to ros2_control_node (launch `remappings=`, or
      # gz_ros2_control <remapping> tags) never reach the controllers.
      # `<controller>.node_options_args` are that controller node's own --ros-args.
      # Remap targets are relative, so they follow the controller manager's namespace.

      isaacbot_amr_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
        node_options_args: ["-r", "~/transition_event:=_isaacbot_amr_joint_state_broadcaster/transition_event"]
   



            
      isaacbot_amr_drive_controller:
        type: diff_drive_controller/DiffDriveController
        node_options_args: ["-r", "~/cmd_vel:=cmd_vel",
                            "-r", "~/odom:=odometry/wheels",
                            "-r", "~/transition_event:=_isaacbot_amr_drive_controller/transition_event"]
      
      isaacbot_amr_imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
        node_options_args: ["-r", "~/imu:=imu/data",
                            "-r", "~/transition_event:=_isaacbot_amr_imu_broadcaster/transition_event"]

  # Per-controller update rates. The controller_manager loop runs at 50 Hz (20 ms). It ran at 25 Hz
  # for the DCC1000, whose async setTargetVelocity call took ~17 ms median and dropped 22-24 % of
  # commands at 20 ms. On the DCC1020, write() only posts the newest target into each wheel's
  # mailbox and a per-wheel worker makes the blocking call, coalescing targets that arrive meanwhile
  # (the "command path" diagnostic counts them as dropped_pending) - check that count on the rover
  # after any rate change. The speed loop itself runs on the boards, not at this rate.
  # Everything that only publishes runs at the rate its consumers use, because each message
  # crosses the Zenoh router to other containers. Each rate must divide the manager's 50 Hz
  # (test/test_wheel_geometry.py), or controller_manager updates it at an uneven period.
  #   joint_states  25 Hz - robot_state_publisher turns each message into /tf, which every
  #                         TF listener on the isaacbot receives.
  #   imu/data      25 Hz - the EKF runs at 50 Hz and simply predicts between samples.
  #   odometry/wheels 50 Hz - diff_drive publishes odometry every update (it has no separate
  #                         publish rate); matches the EKF's 50 Hz.
  # Re-check after any change here: the debounce counts in the URDF (max_*_errors_count) are in
  # cycles (4 = 80 ms at 50 Hz), and the 20 Hz driver-state/safety publishing in read() is
  # time-gated, so it keeps its average with up to 20 ms of jitter.
  isaacbot_amr_joint_state_broadcaster:
    ros__parameters:
      update_rate: 25

  isaacbot_amr_imu_broadcaster:
    ros__parameters:
      update_rate: 25
      sensor_name: "<namespace>/imu"
      frame_id: "<namespace>/imu_link"
      static_covariance_orientation: [1.8e-3, 0.0, 0.0, 0.0, 1.8e-3, 0.0, 0.0, 0.0, 1.8e-3]
      static_covariance_angular_velocity: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
      static_covariance_linear_acceleration: [7.6e-4, 0.0, 0.0, 0.0, 7.6e-4, 0.0, 0.0, 0.0, 7.6e-4]

  isaacbot_amr_drive_controller:
    ros__parameters:
      update_rate: 50

      # Plain joint names: diff_drive commands the hardware's wheel velocity interfaces, and the
      # DCC1020s close the speed loop.
      left_wheel_names: ["rl_wheel_base_to_rl_wheel_joint", "fl_wheel_base_to_fl_wheel_joint"]
      right_wheel_names: ["rr_wheel_base_to_rr_wheel_joint", "fr_wheel_base_to_fr_wheel_joint"]

      wheels_per_side: 2
      # Must match isaacbot_amr_description/config/wheel_01.yaml (enforced by test/test_wheel_geometry.py)
      wheel_separation: 0.617
      wheel_radius: 0.1651

      # Calibrated as 1.63 against the old 0.62602 separation and rescaled to the new separation;
      # effective track 0.617 * 1.659 = 1.0236 m.
      wheel_separation_multiplier: 1.659

      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      odom_frame_id: odom
      base_frame_id: base_footprint
      tf_frame_prefix: "~"
      twist_covariance_diagonal: [5.4e-5, 5.4e-5, 0.0, 0.0, 0.0, 1.9e-4]

      open_loop: false

      position_feedback: false
      velocity_rolling_window_size: 1

      enable_odom_tf: false

      cmd_vel_timeout: 0.5
      # ~/cmd_vel_out has no consumer; each message crosses the Zenoh router, so it stays off.
      publish_limited_velocity: false

      # linear.x and angular.z are limited independently, so the outer wheel rim speed can reach
      #   v + w * (wheel_separation * wheel_separation_multiplier) / 2  =  v + w * 0.5118
      # 1.2 + 1.5 * 0.5118 = 1.968 m/s (11.92 rad/s at r = 0.1651), ~5 % under the DCC1020 target
      # clamp (max_rpm_motor_speed 2800 / gear 23.3 = 12.58 rad/s), which is also the URDF joint
      # limit. Both bounds are enforced by test/test_wheel_geometry.py: past them a board would
      # clip its wheel and bend the commanded arc.
      # isaacbot_amr_crsf_teleop scales stick commands against the same budget
      # (max_wheel_rim_speed / effective_track_width).
      # Acceleration limits: the SWRS targets (rover_platform_mbse/data/swrs/rover_controller.json),
      # 2.7 m/s^2 / 3.74 rad/s^2. The DCC1000-era 1.4 / 1.3 came from that board's duty ramp and
      # the host PIDs. ASSUMPTION until confirmed on the ground (wheel_step_response; with
      # motor_current_limit 15 A, check for slip and tipping). This controller owns the body
      # acceleration: each board's ramp (motor_acceleration_rpm_s) is set just above the worst
      # outer-wheel demand, so it only backs this up per wheel. Nav 2 velocity_smoother, MPPI ax/az
      # and rotational_acc_lim must stay <= these (isaacbot_amr_orchestrator).
      # Jerk limits: none (NAN), as in the SWRS. 2.0 m/s^3 was set 2026-10-25 at 25 Hz, where a
      # low-speed command reached the wheels as one 40 ms step; at 50 Hz the steps halve and each
      # board ramps them. If wheels-lifted steps at 0.05 m/s show jumps again, bring max_jerk back.
      linear:
        x:
          max_velocity: 1.2 # m/s
          min_velocity: -1.2 # m/s
          max_acceleration: 2.7 # m/s^2
          max_deceleration: -2.7 # m/s^2
          max_acceleration_reverse: -2.7 # m/s^2
          max_deceleration_reverse: 2.7 # m/s^2
          max_jerk: .NAN # m/s^3 (NAN = no limit)
          min_jerk: .NAN # m/s^3

      angular:
        z:
          max_velocity: 1.5 # rad/s
          min_velocity: -1.5 # rad/s
          max_acceleration: 3.74 # rad/s^2
          max_deceleration: -3.74 # rad/s^2
          max_acceleration_reverse: -3.74 # rad/s^2
          max_deceleration_reverse: 3.74 # rad/s^2
          max_jerk: .NAN # rad/s^3 (NAN = no limit)
          min_jerk: .NAN # rad/s^3
