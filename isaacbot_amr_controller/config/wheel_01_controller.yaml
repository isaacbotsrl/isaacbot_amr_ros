# Wheel-speed loop: isaacbot_amr_drive_controller -> hardware. Each wheel's DCC1020 closes the
# speed loop on board (MotorVelocityController: trapezoidal profile + PID, rescaled to motor RPM -
# see isaacbot_amr_hardware_interface PhidgetMotorDriver), so diff_drive writes the wheel joints'
# velocity command interfaces directly. Until the DCC1020 swap the DCC1000s only took a duty cycle
# and reported encoders at 10 Hz, so the host closed the loop through four
# isaacbot_amr_controller/SeededPidController instances chained under diff_drive; that controller
# is still built (and its tuning history is in docs/wheel_pid_tuning_notes.md), it is just no
# longer spawned. The on-board velocity gains live in the URDF (ardennes_macro.urdf.xacro).
/**:
  controller_manager:
    ros__parameters:
      update_rate: 25

      # Topic remaps live here, not on ros2_control_node. controller_manager creates
      # every controller as its own node with use_global_arguments=false, so
      # command-line remaps given to ros2_control_node (launch `remappings=`, or
      # gz_ros2_control <remapping> tags) never reach the controllers.
      # `<controller>.node_options_args` are that controller node's own --ros-args.
      # Remap targets are relative, so they follow the controller manager's namespace.

      isaacbot_amr_joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
        node_options_args: ["-r", "~/transition_event:=_isaacbot_amr_joint_state_broadcaster/transition_event"]
   



            
      isaacbot_amr_drive_controller:
        type: diff_drive_controller/DiffDriveController
        node_options_args: ["-r", "~/cmd_vel:=cmd_vel",
                            "-r", "~/odom:=odometry/wheels",
                            "-r", "~/transition_event:=_isaacbot_amr_drive_controller/transition_event"]
      
      isaacbot_amr_imu_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
        node_options_args: ["-r", "~/imu:=imu/data",
                            "-r", "~/transition_event:=_isaacbot_amr_imu_broadcaster/transition_event"]

  # Per-controller update rates. The controller_manager loop runs at 25 Hz (40 ms; was 50 Hz until
  # the instrumented build, 100 Hz before that). 25 Hz was chosen for the DCC1000, whose async
  # setTargetVelocity call took ~17 ms median / ~28 ms p90 and dropped 22-24 % of commands at 20 ms.
  # The DCC1020 velocity controller has no async setter: each wheel's command worker sends the
  # newest target with a blocking call and coalesces any that arrive meanwhile (the "command path"
  # diagnostic counts them as dropped_pending). Re-measure that latency on the DCC1020 before
  # raising the rate - the speed loop itself now runs on the boards, not at this rate.
  # Everything that only publishes runs at the rate its consumers use, because each message
  # crosses the Zenoh router to other containers. Each rate must divide the manager's 25 Hz
  # (test/test_wheel_geometry.py), or controller_manager updates it at an uneven period.
  #   joint_states  25 Hz - robot_state_publisher turns each message into /tf, which every
  #                         TF listener on the isaacbot receives.
  #   imu/data      25 Hz - the manager's rate (the IMU component is read in the same loop). The
  #                         EKF still runs at 50 Hz and simply predicts between samples.
  #   odometry/wheels 25 Hz - diff_drive publishes odometry every update (it has no separate
  #                         publish rate); the EKF runs at 50 Hz.
  # Re-check after any change here: the debounce counts in the URDF (max_*_errors_count) are in
  # cycles, so 2 now means 80 ms instead of 40 ms, and the 20 Hz driver-state/safety publishing in
  # read() is time-gated, so it keeps its average but with up to 40 ms of jitter.
  isaacbot_amr_joint_state_broadcaster:
    ros__parameters:
      update_rate: 25

  isaacbot_amr_imu_broadcaster:
    ros__parameters:
      update_rate: 25
      sensor_name: "<namespace>/imu"
      frame_id: "<namespace>/imu_link"
      static_covariance_orientation: [1.8e-3, 0.0, 0.0, 0.0, 1.8e-3, 0.0, 0.0, 0.0, 1.8e-3]
      static_covariance_angular_velocity: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
      static_covariance_linear_acceleration: [7.6e-4, 0.0, 0.0, 0.0, 7.6e-4, 0.0, 0.0, 0.0, 7.6e-4]

  isaacbot_amr_drive_controller:
    ros__parameters:
      update_rate: 25

      # Plain joint names: diff_drive commands the hardware's wheel velocity interfaces, and the
      # DCC1020s close the speed loop. A "<controller>/<joint>" name would chain through another
      # controller's reference interface instead (the launch file spawns any such controller
      # together with this one).
      left_wheel_names: ["rl_wheel_base_to_rl_wheel_joint", "fl_wheel_base_to_fl_wheel_joint"]
      right_wheel_names: ["rr_wheel_base_to_rr_wheel_joint", "fr_wheel_base_to_fr_wheel_joint"]

      wheels_per_side: 2
      # Must match isaacbot_amr_description/config/wheel_01.yaml (enforced by test/test_wheel_geometry.py)
      wheel_separation: 0.617
      wheel_radius: 0.1651

      # Calibrated as 1.63 against the old 0.62602 separation; rescaled to the measured 0.615 so
      # the effective track stays 0.62602 * 1.63 = 1.020 m and the odometry yaw scale is unchanged.
      wheel_separation_multiplier: 1.659

      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      odom_frame_id: odom
      base_frame_id: base_footprint
      tf_frame_prefix: "~"
      twist_covariance_diagonal: [5.4e-5, 5.4e-5, 0.0, 0.0, 0.0, 1.9e-4]

      open_loop: false

      position_feedback: false
      velocity_rolling_window_size: 1

      enable_odom_tf: false

      cmd_vel_timeout: 0.5
      # ~/cmd_vel_out was only read by the wheel PIDs' turn feed-forward; each message crosses
      # the Zenoh router, so it stays off now that nothing consumes it.
      publish_limited_velocity: false

      # linear.x and angular.z are limited independently, so the outer wheel rim speed can reach
      #   v + w * (wheel_separation * wheel_separation_multiplier) / 2  =  v + w * 0.5102
      # 0.95 + 1.5 * 0.5102 = 1.715 m/s (10.39 rad/s at r = 0.1651), under the URDF joint limit
      # (10.958 rad/s) and the DCC1020 target clamp (max_rpm_motor_speed 2800 / gear 23.3 =
      # 12.58 rad/s). Both bounds are enforced by test/test_wheel_geometry.py.
      # isaacbot_amr_crsf_teleop scales stick commands against the same budget
      # (max_wheel_rim_speed / effective_track_width).
      # Acceleration limits: measured on the ground 2026-10-06 with the DCC1000 (duty ramp 1.0,
      # host wheel PIDs; best sustained wheel accel 10.2 rad/s^2 -> 0.8 * r * alpha = 1.4 m/s^2,
      # turns 1.3 rad/s^2). TBD - re-measure with the DCC1020 on-board loop and its
      # motor_acceleration_rpm_s (wheel_step_response). Nav 2 velocity_smoother, MPPI ax/az and
      # rotational_acc_lim must stay <= these (isaacbot_amr_orchestrator).
      # Jerk limits: 2.0 m/s^3 / 2.0 rad/s^3, set 2026-10-25 with the wheels lifted. Without them a
      # low-speed command (under one 40 ms rate-limit step, e.g. 0.05 m/s) reached the wheels as an
      # instant step: the largest single-sample change at a 0.05 m/s start was 85 % of the step,
      # 107 % at the stop. With these and the DCC1020 ramp (motor_acceleration_rpm_s) it is
      # 42 % / 37 %, and ramp roughness halves at 0.05 and 0.2 m/s. The cost: 0 -> 0.5 m/s takes
      # ~0.7 s to 90 % instead of ~0.33 s. control_toolbox only limits jerk while the acceleration
      # builds, not as it eases off. Angular uses the same value, not separately tested.
      linear:
        x:
          max_velocity: 0.95 # m/s
          min_velocity: -0.95 # m/s
          max_acceleration: 1.4 # m/s^2
          max_deceleration: -1.4 # m/s^2
          max_acceleration_reverse: -1.4 # m/s^2
          max_deceleration_reverse: 1.4 # m/s^2
          max_jerk: 2.0 # m/s^3
          min_jerk: .NAN # m/s^3 (NAN = -max_jerk)

      angular:
        z:
          max_velocity: 1.5 # rad/s
          min_velocity: -1.5 # rad/s
          max_acceleration: 1.3 # rad/s^2
          max_deceleration: -1.3 # rad/s^2
          max_acceleration_reverse: -1.3 # rad/s^2
          max_deceleration_reverse: 1.3 # rad/s^2
          max_jerk: 2.0 # rad/s^3
          min_jerk: .NAN # rad/s^3 (NAN = -max_jerk)
