# Simulation-only overrides for the drive controller, loaded after isaacbot_amr_controller's
# wheel_01_controller.yaml (the spawner applies its param files in order, so these win).
# diff_drive drives GazeboSimSystem's velocity joints directly, the same topology as the robot.
/**:
  # Gazebo's wheels are rigid cylinders of the CAD tyre radius (isaacbot_amr_description wheel_01.yaml
  # tyre_radius), so they roll at 0.1699, not at the real tyre's loaded 0.1651 the odometry is
  # tuned on. Without this the simulated wheel odometry under-reports distance by ~2.9 %.
  isaacbot_amr_drive_controller:
    ros__parameters:
      wheel_radius: 0.1699
